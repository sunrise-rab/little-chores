{% extends "base.html" %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 p-3">
        <div class="card shadow-sm">
      <div class="delete-child card p-4 text-center">
        <h2 class="task-title text-danger">Delete Child</h2>

        <p>
          Are you sure you want to delete
          <strong>{{ child.name|capfirst }}</strong>?
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-between">
            <a class=" delete-child" href="{% url 'dashboard:dashboard' %}">
              Cancel
            </a>
            <button type="submit">
              Delete
            </button>
          </div>
        </form>
      </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

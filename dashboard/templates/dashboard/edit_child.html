{% extends "base.html" %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h2 class="task-title text-center">Edit {{ child.name|capfirst }}</h2>

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}

          <div class="d-flex justify-content-between">
            <a href="{% url 'dashboard:dashboard' %}"
               class="btn btn-outline-secondary">
              Cancel
            </a>
            <button type="submit" class="btn btn-primary">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

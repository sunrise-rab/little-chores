{% extends "base.html" %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 p-3">
        <div class="card shadow-sm">
      <div class=" edit-child card p-4">
        <h2 class="task-title text-center">Edit {{ child.name|capfirst }}</h2>

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-flex justify-content-between">
            <a href="{% url 'dashboard:dashboard' %}">
              Cancel
            </a>
            <button type="submit">
              Save Changes
            </button>
          </div> 
        </form>
      </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 p-3">
      <div class="card shadow-sm">
        <div class="add-child card-body p-3">
      <h1 class="task-title h3 mb-4">Add Child</h1>

        <form  id ="ChildForm" method="post">
          {{ child_form | crispy }}
          {% csrf_token %}
          <button type="submit">
            Save
          </button>
          <a href="{% url 'dashboard:dashboard' %} ">
            Cancel
          </a>
        </form>
      </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

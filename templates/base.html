{% load static %}
{% url 'home' as home_url %}
{% url 'dashboard' as dashboard_url %}

<!DOCTYPE html>
<html class="h-100" lang="en">
<head>
    <title>Little Chores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x"
          crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-lg">
    <div class="container">
      <a class="navbar-brand" href="{{ home_url }}">
        <span class="big">Little</span><span class="small-logo">Chores</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
              aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse ms-auto" id="navbarText">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if request.path == home_url %}active{% endif %}"
               aria-current="page" href="{{ home_url }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == dashboard_url %}active{% endif %}"
               aria-current="page" href="{{dashboard_url}}">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == home_url %}active{% endif %}"
               aria-current="page" href="{{ home_url }}">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == home_url %}active{% endif %}"
               aria-current="page" href="{{ home_url }}">Logout</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == home_url %}active{% endif %}"
               aria-current="page" href="{{ home_url }}">Register</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="main-lg">
  {% block content %}{% endblock content %}
</main>

<footer class="footer mt-auto py-3 navbar-lg">
  <p class="m-0 text-center text-white">
    <a href="https://github.com/sunrise-rab/" class="text-white">Rabia Er-raji</a><br>
    Project 3
  </p>
</footer>

<!-- Font awesome kit-->
<script src="https://kit.fontawesome.com/5cfdac059a.js" crossorigin="anonymous"></script>
<script src="{% static 'js/script.js' %}"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
        crossorigin="anonymous"></script>
</body>
</html>
